<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EWS Bridge</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header>
    <img src="../icons/bridge.svg" alt="" width="40" height="40">
    <div>
      <h1>EWS Bridge</h1>
      <p class="sub">Exchange mail, calendar, contacts and directory in Thunderbird</p>
    </div>
  </header>

  <div id="startup-error" class="banner error" hidden></div>

  <section>
    <h2>Accounts</h2>
    <div id="accounts"><p class="muted">Loading…</p></div>
  </section>

  <section>
    <h2>Add an Exchange account</h2>
    <form id="add-form" autocomplete="off">
      <div class="grid">
        <label>E-mail address
          <input name="email" type="email" required placeholder="firstname.lastname@example.org">
        </label>
        <label>Password
          <input name="password" type="password" required>
        </label>
      </div>
      <details id="advanced">
        <summary>Advanced (username, server, authentication)</summary>
        <div class="grid">
          <label>Username <span class="muted">— if it differs from the e-mail address</span>
            <input name="username" placeholder="DOMAIN\user or user@domain">
          </label>
          <label>EWS URL <span class="muted">— leave empty to detect</span>
            <input name="ewsUrl" type="url" placeholder="https://mail.example.org/EWS/Exchange.asmx">
          </label>
          <label>Authentication
            <select name="authMethod">
              <option value="auto">Automatic (NTLM / Basic, as offered)</option>
              <option value="negotiate">Kerberos (Negotiate, needs a ticket from kinit)</option>
            </select>
          </label>
        </div>
      </details>
      <div class="actions">
        <button type="submit" id="test-btn" class="primary">Connect</button>
        <span id="test-status" class="muted"></span>
      </div>
    </form>

    <div id="test-result" hidden>
      <ul id="attempts" class="attempts"></ul>
      <div id="found" hidden>
        <dl class="facts">
          <dt>Name</dt><dd id="f-name"></dd>
          <dt>EWS URL</dt><dd id="f-url"></dd>
          <dt>Username</dt><dd id="f-user"></dd>
          <dt>Server</dt><dd id="f-server"></dd>
        </dl>
        <label class="check"><input type="checkbox" id="opt-cal" checked> Calendars</label>
        <label class="check"><input type="checkbox" id="opt-contacts" checked> Contacts</label>
        <div class="actions">
          <button id="add-btn" class="primary">Add to Thunderbird</button>
          <span id="add-status" class="muted"></span>
        </div>
      </div>
      <p id="hint" class="banner warn" hidden></p>
    </div>
  </section>

  <section>
    <h2>Diagnostics</h2>
    <p id="ports" class="muted"></p>
    <div class="actions">
      <label>Log level
        <select id="log-level">
          <option value="error">Errors</option>
          <option value="warn">Warnings</option>
          <option value="info">Info</option>
          <option value="debug">Debug (protocol traces)</option>
        </select>
      </label>
      <button id="refresh-log">Refresh</button>
      <button id="copy-log">Copy</button>
    </div>
    <pre id="log" class="log"></pre>
  </section>

  <template id="account-tpl">
    <div class="account">
      <div class="acc-main">
        <strong class="acc-email"></strong>
        <span class="acc-url muted"></span>
        <span class="acc-status"></span>
      </div>
      <div class="acc-actions">
        <button class="check-btn">Check connection</button>
        <button class="pw-btn">Change password</button>
        <button class="remove-btn danger">Remove</button>
      </div>
    </div>
  </template>

  <script src="options.js"></script>
</body>
</html>
